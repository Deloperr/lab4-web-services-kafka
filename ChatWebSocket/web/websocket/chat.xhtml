<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="ru">
<head>
    <title>WebSocket чат</title>
    <style>
        body { font: 16px system-ui, sans-serif; max-width: 45rem; margin: 2rem auto; padding: 0 1rem; }
        #log { min-height: 14rem; max-height: 22rem; overflow: auto; border: 1px solid #889; padding: .75rem; overflow-wrap: anywhere; }
        input { width: 70%; }
    </style>
</head>
<body>
    <h1>WebSocket чат</h1>
    <p>Отправьте сообщение, <code>time</code>, <code>dol</code>, <code>eu</code> или выражение <code>2+4*7</code>.</p>
    <div id="log" role="log"></div>
    <form id="chat-form">
        <label for="chat">Сообщение</label><br />
        <input id="chat" autocomplete="off" required="required" />
        <button id="send" disabled="disabled">Отправить</button>
    </form>
    <script type="application/javascript"><![CDATA[
        const log = document.getElementById('log');
        const input = document.getElementById('chat');
        const send = document.getElementById('send');
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(protocol + '//' + location.host + '/examples/websocket/chat');
        function show(message) {
            const entry = document.createElement('div');
            entry.textContent = message;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }
        socket.onopen = () => { send.disabled = false; show('Соединение открыто.'); };
        socket.onmessage = event => show(event.data);
        socket.onerror = () => show('Ошибка WebSocket.');
        socket.onclose = () => { send.disabled = true; show('Соединение закрыто.'); };
        document.getElementById('chat-form').onsubmit = event => {
            event.preventDefault();
            if (socket.readyState === WebSocket.OPEN && input.value.trim()) {
                socket.send(input.value);
                input.value = '';
            }
        };
    ]]></script>
</body>
</html>
